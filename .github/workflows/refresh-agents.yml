name: Refresh Agents

on:
  schedule:
    # Weekly: Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no changes)'
        required: false
        default: 'false'
        type: boolean
      max_agents:
        description: 'Maximum agents to process (0 = all)'
        required: false
        default: '0'
        type: string

concurrency:
  group: refresh-agents
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh Agent Knowledge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run agent refresh
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.max_agents }}" != "0" ] && [ -n "${{ inputs.max_agents }}" ]; then
            ARGS="$ARGS --max-agents ${{ inputs.max_agents }}"
          fi
          node scripts/refresh-agents-ci.mjs $ARGS

      - name: Regenerate component-versions.json
        if: inputs.dry_run != 'true'
        run: node scripts/generate-version-index.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/refresh-agents
          commit-message: |
            chore: weekly agent knowledge refresh

            Automated refresh of agent reference URLs.
            Updated lastRefreshed timestamps and Latest Updates sections.
          title: 'chore: weekly agent knowledge refresh'
          body: |
            ## Automated Agent Refresh

            This PR was automatically generated by the weekly agent refresh workflow.

            ### What changed
            - Fetched latest information from agent reference URLs
            - Updated `## Latest Updates` sections with findings
            - Bumped `lastRefreshed` timestamps
            - Bumped patch versions for updated agents
            - Regenerated `component-versions.json`

            ### Review checklist
            - [ ] Review updated agent content for accuracy
            - [ ] Verify no broken formatting
            - [ ] Check that version bumps are correct

            ---
            *Generated by [refresh-agents.yml](.github/workflows/refresh-agents.yml)*
          labels: |
            automated
            agent-refresh
          delete-branch: true

  validate-references:
    name: Validate Reference URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate reference URLs
        run: node scripts/validate-references.mjs --verbose
        continue-on-error: true
