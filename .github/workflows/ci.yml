name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Install dependencies (shared by jobs)
  # ──────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all workspace dependencies
        run: npm install

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

  # ──────────────────────────────────────────────
  # Job 2: Build all MCP servers
  # ──────────────────────────────────────────────
  build-mcp-servers:
    name: Build MCP Servers
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        server:
          - api-specialist-mcp
          - code-review-mcp
          - design-system-mcp
          - testing-mcp
          - uiux-review-mcp
          - cicd-pipeline
          - database-operations
          - dependency-management
          - n8n-automation
          - rag-mcp
          - project-oversight-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Build shared library
        working-directory: mcp-servers/mcp-shared
        run: npm run build

      - name: Build server
        working-directory: mcp-servers/${{ matrix.server }}
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "mcp-servers/${{ matrix.server }}/build/index.js" ]; then
            echo "::error::Build artifact missing: mcp-servers/${{ matrix.server }}/build/index.js"
            exit 1
          fi
          echo "Build verified: mcp-servers/${{ matrix.server }}/build/index.js"

  # ──────────────────────────────────────────────
  # Job 3: Build and test mcp-shared library
  # ──────────────────────────────────────────────
  test-mcp-shared:
    name: Test MCP Shared
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Build
        working-directory: mcp-servers/mcp-shared
        run: npm run build

      - name: Run tests
        working-directory: mcp-servers/mcp-shared
        run: npm test

  # ──────────────────────────────────────────────
  # Job 4: Test MCP servers
  # ──────────────────────────────────────────────
  test-mcp-servers:
    name: Test MCP Servers
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        server:
          - code-review-mcp
          - api-specialist-mcp
          - design-system-mcp
          - testing-mcp
          - uiux-review-mcp
          - cicd-pipeline
          - database-operations
          - dependency-management
          - n8n-automation
          - rag-mcp
          - project-oversight-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Build shared library
        working-directory: mcp-servers/mcp-shared
        run: npm run build

      - name: Run tests
        working-directory: mcp-servers/${{ matrix.server }}
        run: npm test

  # ──────────────────────────────────────────────
  # Job 5: Build and test trigger-matcher
  # ──────────────────────────────────────────────
  test-trigger-matcher:
    name: Test Trigger Matcher
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Build
        working-directory: trigger-matcher
        run: npm run build

      - name: Run tests
        working-directory: trigger-matcher
        run: npm test

  # ──────────────────────────────────────────────
  # Job 6: Lint TypeScript
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Run ESLint (zero tolerance)
        run: npx eslint --max-warnings 0 .

  # ──────────────────────────────────────────────
  # Job 7: TypeScript type checking
  # ──────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: mcp-servers/mcp-shared
          - dir: trigger-matcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Type check
        working-directory: ${{ matrix.dir }}
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────
  # Job 8: Validate agent/skill/command frontmatter
  # ──────────────────────────────────────────────
  validate-frontmatter:
    name: Validate Frontmatter
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Validate frontmatter
        run: node scripts/validate-frontmatter.mjs

  # ──────────────────────────────────────────────
  # Job 8b: Validate component-versions.json is in sync
  # ──────────────────────────────────────────────
  validate-version-index:
    name: Validate Version Index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate and diff component-versions.json
        run: |
          node scripts/generate-version-index.mjs
          if ! git diff --exit-code component-versions.json; then
            echo "::error::component-versions.json is out of sync. Run 'npm run generate:versions' and commit."
            exit 1
          fi
          echo "component-versions.json is in sync"

  # ──────────────────────────────────────────────
  # Job 8c: Test versioning scripts
  # ──────────────────────────────────────────────
  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Run version index tests
        run: node --test scripts/__tests__/generate-version-index.test.mjs

      - name: Run manifest helper tests
        run: bash scripts/__tests__/manifest-helper.test.sh

      - name: Run update-component tests
        run: bash scripts/__tests__/update-component.test.sh

  # ──────────────────────────────────────────────
  # Job 9: Shell script validation
  # ──────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -name '*.sh' \
            -not -path '*/node_modules/*' \
            -not -path '*/venv/*' \
            -not -path '*/build/*' \
            -not -path '*/demo/*' \
            | while read -r script; do
              echo "Checking: $script"
              shellcheck --severity=warning "$script" || true
            done

          # Strict check on critical install scripts (fail the job if these have issues)
          echo ""
          echo "=== Strict check on install scripts ==="
          shellcheck --severity=error \
            mcp-servers/install-all.sh \
            config-bundle/scripts/install-all.sh \
            skills/pm-dashboard/pm-tui.sh

  # ──────────────────────────────────────────────
  # Job 10: Security scan
  # ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          FOUND=0

          # Check for hardcoded API keys, passwords, tokens in source files
          if grep -rn --include='*.ts' --include='*.js' --include='*.json' \
            -E '(api[_-]?key|password|secret|token)\s*[:=]\s*["\x27][A-Za-z0-9+/=]{20,}' \
            --exclude-dir=node_modules \
            --exclude-dir=build \
            --exclude-dir=demo \
            --exclude='package-lock.json' \
            .; then
            echo "::error::Potential secrets found in source files"
            FOUND=1
          fi

          # Check for .env files that shouldn't be committed
          if find . -name '.env' -not -path '*/node_modules/*' -not -name '.env.example' | grep -q .; then
            echo "::error::.env file found in repository"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Security scan failed - secrets or .env files detected"
            exit 1
          else
            echo "No secrets detected"
          fi

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ──────────────────────────────────────────────
  # Job 11: Performance benchmarks (build time only)
  # ──────────────────────────────────────────────
  benchmark:
    name: Build Benchmarks
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package-lock.json') }}

      - name: Download previous benchmark
        id: prev-benchmark
        uses: dawidd6/action-download-artifact@v6
        with:
          name: benchmark-results
          workflow: ci.yml
          branch: main
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Save previous results
        if: steps.prev-benchmark.outcome == 'success'
        run: |
          if [ -f benchmark-results.json ]; then
            cp benchmark-results.json previous-benchmark.json
            echo "Previous benchmark found"
          fi

      - name: Build shared library
        working-directory: mcp-servers/mcp-shared
        run: npm run build

      - name: Benchmark MCP server builds
        run: |
          echo "MCP Server Build Times"
          echo "======================"
          TOTAL=0
          FAILED=0
          RESULTS="[]"
          for dir in mcp-servers/*/; do
            server=$(basename "$dir")
            if [ "$server" = "mcp-shared" ]; then continue; fi
            if [ ! -f "$dir/package.json" ]; then continue; fi
            START=$(date +%s%N)
            cd "$dir"
            if npm run build 2>/dev/null; then
              END=$(date +%s%N)
              ELAPSED=$(( (END - START) / 1000000 ))
              echo "$server: ${ELAPSED}ms"
              TOTAL=$((TOTAL + ELAPSED))
              RESULTS=$(echo "$RESULTS" | jq --arg s "$server" --argjson t "$ELAPSED" '. + [{"server": $s, "buildTimeMs": $t}]')
            else
              echo "::error::$server: BUILD FAILED"
              FAILED=$((FAILED + 1))
            fi
            cd - > /dev/null
          done
          echo ""
          echo "Total build time: ${TOTAL}ms"

          # Save results to JSON file
          jq -n \
            --argjson results "$RESULTS" \
            --argjson total "$TOTAL" \
            --argjson failed "$FAILED" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "${{ github.sha }}" \
            '{
              date: $date,
              commit: $commit,
              totalBuildTimeMs: $total,
              failedBuilds: $failed,
              servers: $results
            }' > benchmark-results.json

          echo ""
          echo "=== Benchmark Results ==="
          cat benchmark-results.json

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED server(s) failed to build"
            exit 1
          fi

          # Enforce total build time SLA (120 seconds = 120000ms)
          if [ "$TOTAL" -gt 120000 ]; then
            echo "::warning::Total build time (${TOTAL}ms) exceeds 120s SLA"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 90

      - name: Compare with previous benchmark
        if: steps.prev-benchmark.outcome == 'success' && hashFiles('previous-benchmark.json') != ''
        run: |
          echo ""
          echo "=== Benchmark Trend Analysis ==="
          echo ""

          # Compare total build times
          PREV_TOTAL=$(jq '.totalBuildTimeMs' previous-benchmark.json)
          CURR_TOTAL=$(jq '.totalBuildTimeMs' benchmark-results.json)
          DIFF=$((CURR_TOTAL - PREV_TOTAL))
          PCT=$(( (DIFF * 100) / (PREV_TOTAL > 0 ? PREV_TOTAL : 1) ))

          if [ "$DIFF" -gt 0 ]; then
            echo "Total: ${CURR_TOTAL}ms (+${DIFF}ms, +${PCT}%)"
          else
            echo "Total: ${CURR_TOTAL}ms (${DIFF}ms, ${PCT}%)"
          fi

          # Compare per-server build times
          echo ""
          echo "Per-server comparison:"
          jq -r '.servers[] | "\(.server) \(.buildTimeMs)"' benchmark-results.json | while read -r server curr_ms; do
            prev_ms=$(jq -r --arg s "$server" '.servers[] | select(.server == $s) | .buildTimeMs' previous-benchmark.json 2>/dev/null)
            if [ -n "$prev_ms" ] && [ "$prev_ms" != "null" ]; then
              diff_ms=$((curr_ms - prev_ms))
              if [ "$diff_ms" -gt 5000 ]; then
                echo "::warning::$server: ${curr_ms}ms (+${diff_ms}ms) — significant regression"
              elif [ "$diff_ms" -gt 0 ]; then
                echo "  $server: ${curr_ms}ms (+${diff_ms}ms)"
              else
                echo "  $server: ${curr_ms}ms (${diff_ms}ms)"
              fi
            else
              echo "  $server: ${curr_ms}ms (new)"
            fi
          done

          # Warn if total regression exceeds 20%
          if [ "$PCT" -gt 20 ]; then
            echo ""
            echo "::warning::Build time regression of ${PCT}% detected (${PREV_TOTAL}ms → ${CURR_TOTAL}ms)"
          fi

  # ──────────────────────────────────────────────
  # Job 12: Markdown link validation
  # ──────────────────────────────────────────────
  validate-links:
    name: Validate Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal markdown links
        run: |
          echo "Checking internal markdown links..."
          BROKEN=0

          # Find all markdown links to local files
          grep -rn --include='*.md' -oP '\[.*?\]\((?!https?://|#|mailto:)(.*?)\)' \
            --exclude-dir=node_modules \
            --exclude-dir=build \
            --exclude-dir=demo \
            --exclude-dir=venv \
            . | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1)
              lineno=$(echo "$line" | cut -d: -f2)
              # Extract the path from the markdown link
              target=$(echo "$line" | grep -oP '\((?!https?://|#|mailto:)\K[^)#]+')

              if [ -z "$target" ]; then
                continue
              fi

              # Resolve relative to the file's directory
              dir=$(dirname "$file")
              resolved="$dir/$target"

              if [ ! -e "$resolved" ] && [ ! -e "$target" ]; then
                echo "::warning file=$file,line=$lineno::Broken link: $target"
                BROKEN=1
              fi
            done

          if [ "$BROKEN" -eq 0 ]; then
            echo "All internal links valid"
          fi
