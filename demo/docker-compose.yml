# docker-compose.yml
# Phase 8: DevOps & Deployment
#
# Development and production docker-compose configuration.
# Should trigger: devops-infrastructure-expert

version: '3.9'

services:
  # ==================
  # Application
  # ==================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: taskmanager-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-taskmanager}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - NEXT_PUBLIC_WS_URL=http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================
  # PostgreSQL Database
  # ==================
  db:
    image: postgres:15-alpine
    container_name: taskmanager-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-taskmanager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================
  # Redis Cache
  # ==================
  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================
  # WebSocket Server (optional separate service)
  # ==================
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: taskmanager-ws
    restart: unless-stopped
    ports:
      - "${WS_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-taskmanager}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    command: ["node", "ws-server.js"]
    depends_on:
      - db
      - redis
    networks:
      - taskmanager-network
    profiles:
      - websocket

# ==================
# Networks
# ==================
networks:
  taskmanager-network:
    driver: bridge
    name: taskmanager-network

# ==================
# Volumes
# ==================
volumes:
  postgres-data:
    name: taskmanager-postgres-data
  redis-data:
    name: taskmanager-redis-data
