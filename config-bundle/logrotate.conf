# Logrotate configuration for Claude Code logs
#
# Installation:
#   Option 1 (user crontab - recommended):
#     crontab -e
#     Add: 0 0 * * * /usr/sbin/logrotate -s ~/.claude/logrotate.state ~/.claude/logrotate.conf
#
#   Option 2 (system logrotate - requires sudo):
#     sudo ln -s ~/.claude/logrotate.conf /etc/logrotate.d/claude-code
#
# Manual rotation:
#   logrotate -f ~/.claude/logrotate.conf

# Agent trigger logs
/home/michel/.claude/logs/agent-triggers.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 michel michel
    dateext
    dateformat -%Y%m%d
    copytruncate
}

# Hook debug logs (if enabled)
/home/michel/.claude/hooks/debug.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 michel michel
    dateext
    dateformat -%Y%m%d
    copytruncate
}
