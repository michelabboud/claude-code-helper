# Redis Configuration with Persistence
# This DOES NOT reduce RAM usage!

# ============================================
# RDB PERSISTENCE (Snapshotting)
# ============================================
# Save RAM snapshot to disk periodically

save 900 1        # After 900 sec (15 min) if >= 1 key changed
save 300 10       # After 300 sec (5 min) if >= 10 keys changed
save 60 10000     # After 60 sec (1 min) if >= 10000 keys changed

# Stop writes if snapshot fails
stop-writes-on-bgsave-error yes

# Compress RDB files
rdbcompression yes

# Checksum for corruption detection
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Directory for persistence files
dir /data/redis

# ============================================
# AOF PERSISTENCE (Append-Only File)
# ============================================
# Log every write operation

# Enable AOF
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# Fsync strategy
# - always: Slow but safest
# - everysec: Good balance (default)
# - no: Fastest but risky
appendfsync everysec

# Rewrite AOF when it grows too large
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================
# MEMORY LIMITS (This is the key!)
# ============================================

# Maximum memory Redis can use
maxmemory 2gb

# What to do when maxmemory is reached:
# - noeviction: Return errors when memory full
# - allkeys-lru: Evict least recently used keys
# - allkeys-lfu: Evict least frequently used
# - volatile-lru: Evict LRU from keys with TTL
# - volatile-lfu: Evict LFU from keys with TTL
# - volatile-ttl: Evict keys with shortest TTL
# - allkeys-random: Evict random keys
maxmemory-policy noeviction

# ============================================
# IMPORTANT NOTES
# ============================================
#
# 1. ALL data must fit in maxmemory (2gb in this example)
#    If you have 5gb of vectors, they WON'T FIT!
#
# 2. Persistence (RDB/AOF) is for crash recovery ONLY
#    It does NOT allow you to store more data than RAM
#
# 3. If Redis restarts, it loads EVERYTHING from disk into RAM
#    If data doesn't fit in maxmemory, Redis will fail to start!
#
# 4. This is fundamentally different from disk-based databases
#    like ChromaDB, PostgreSQL, MongoDB, etc.
